<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spring Chain — self-organizing ball &amp; spring loop</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: rgba(18, 22, 32, 0.82);
    --panel-border: rgba(120, 140, 190, 0.18);
    --ink: #e7ecf6;
    --ink-dim: #9aa6c2;
    --accent: #6ea8fe;
    --accent-2: #f7768e;
    --track: rgba(120, 140, 190, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 70% -10%, #131a2b 0%, var(--bg) 60%);
    color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 286px;
    max-height: calc(100vh - 32px);
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    padding: 16px 16px 14px;
    user-select: none;
  }
  /* Slim scrollbar that only shows when the panel overflows. */
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb {
    background: rgba(120, 140, 190, 0.35); border-radius: 8px;
  }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(120,140,190,0.35) transparent; }
  #panel h1 {
    font-size: 14px; font-weight: 650; letter-spacing: 0.2px;
    margin: 0 0 2px; display: flex; align-items: center; gap: 8px;
  }
  #panel h1 .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent);
  }
  #panel .sub { color: var(--ink-dim); font-size: 11px; margin: 0 0 14px; }

  .field { margin: 11px 0; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .field label { color: var(--ink-dim); font-size: 11.5px; letter-spacing: .2px; }
  .field .val { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px; background: var(--track);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--accent);
  }

  .buttons { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; cursor: pointer; color: var(--ink);
    background: rgba(110,168,254,0.14);
    border: 1px solid rgba(110,168,254,0.35);
    border-radius: 9px; padding: 9px 10px; font-size: 12.5px; font-weight: 600;
    transition: background .15s, transform .05s;
  }
  button:hover { background: rgba(110,168,254,0.24); }
  button:active { transform: translateY(1px); }
  button.secondary {
    background: rgba(120,140,190,0.10);
    border-color: rgba(120,140,190,0.28);
  }
  button.secondary:hover { background: rgba(120,140,190,0.2); }

  .toggles { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .toggles label { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); cursor: pointer; }
  .toggles input { accent-color: var(--accent); }

  details { margin-top: 12px; border-top: 1px solid var(--panel-border); padding-top: 8px; }
  summary { cursor: pointer; color: var(--ink-dim); font-size: 11.5px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--accent); }
  details[open] summary::before { content: "▾ "; }

  #stats {
    position: fixed; bottom: 14px; left: 16px;
    color: var(--ink-dim); font-size: 11px; font-variant-numeric: tabular-nums;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 9px; padding: 7px 11px; backdrop-filter: blur(10px);
  }
  #stats b { color: var(--ink); font-weight: 600; }
  #hint {
    position: fixed; bottom: 14px; right: 16px;
    color: var(--ink-dim); font-size: 11px; text-align: right; opacity: .8;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1><span class="dot"></span> Spring Chain</h1>
  <p class="sub">A random closed loop of balls relaxes under springs &amp; collisions.</p>

  <div class="field">
    <div class="row"><label for="n">Random points (N)</label><span class="val" id="nVal">24</span></div>
    <input type="range" id="n" min="3" max="250" step="1" value="24" />
  </div>

  <div class="field">
    <div class="row"><label for="radius">Render radius</label><span class="val" id="radiusVal">1.00</span></div>
    <input type="range" id="radius" min="0.15" max="2.0" step="0.05" value="1.0" />
  </div>

  <div class="field">
    <div class="row"><label for="interact">Interact radius</label><span class="val" id="interactVal">1.00</span></div>
    <input type="range" id="interact" min="0.15" max="2.0" step="0.05" value="1.0" />
  </div>

  <div class="field">
    <div class="row"><label for="sphere">Sphere radius (spawn)</label><span class="val" id="sphereVal">15</span></div>
    <input type="range" id="sphere" min="3" max="20" step="0.5" value="15" />
  </div>

  <div class="field">
    <div class="row"><label for="ignoreK">Ignore K neighbors (collision)</label><span class="val" id="ignoreKVal">7</span></div>
    <input type="range" id="ignoreK" min="0" max="16" step="1" value="7" />
  </div>

  <div class="buttons">
    <button id="regen">Regenerate</button>
    <button id="pause" class="secondary">Pause</button>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="shadows" checked /> Shadows</label>
    <label><input type="checkbox" id="showLinks" /> Chain links</label>
    <label><input type="checkbox" id="showSpawn" /> Spawn sphere</label>
  </div>

  <details>
    <summary>Physics tuning</summary>
    <div class="field" style="margin-top:10px">
      <div class="row"><label for="mergeRatio">LOD merge (× interact r)</label><span class="val" id="mergeRatioVal">0.30</span></div>
      <input type="range" id="mergeRatio" min="0.1" max="1.0" step="0.05" value="0.3" />
    </div>
    <div class="field">
      <div class="row"><label for="splitRatio">LOD split (× interact r)</label><span class="val" id="splitRatioVal">0.60</span></div>
      <input type="range" id="splitRatio" min="0.5" max="2.5" step="0.05" value="0.6" />
    </div>
    <div class="field">
      <div class="row"><label for="spring">Spring pull (→ 0)</label><span class="val" id="springVal">0.60</span></div>
      <input type="range" id="spring" min="0" max="2" step="0.02" value="0.6" />
    </div>
    <div class="field">
      <div class="row"><label for="collide">Collision push</label><span class="val" id="collideVal">1.00</span></div>
      <input type="range" id="collide" min="0" max="2" step="0.02" value="1.0" />
    </div>
    <div class="field">
      <div class="row"><label for="damp">Damping</label><span class="val" id="dampVal">0.90</span></div>
      <input type="range" id="damp" min="0.5" max="0.99" step="0.01" value="0.9" />
    </div>
    <div class="field">
      <div class="row"><label for="jiggle">Jiggle</label><span class="val" id="jiggleVal">0.00</span></div>
      <input type="range" id="jiggle" min="0" max="3" step="0.05" value="0" />
    </div>
    <div class="field">
      <div class="row"><label for="gravity">Gravity</label><span class="val" id="gravityVal">0.015</span></div>
      <input type="range" id="gravity" min="0" max="0.2" step="0.005" value="0.015" />
    </div>
    <div class="field" style="margin-bottom:8px">
      <label style="display:flex; align-items:center; gap:6px; color:var(--ink-dim); cursor:pointer">
        <input type="checkbox" id="autoSubsteps" checked style="accent-color:var(--accent)" />
        Auto substeps → 30 fps
      </label>
    </div>
    <div class="field">
      <div class="row"><label for="speed">Sim substeps / frame</label><span class="val" id="speedVal">4</span></div>
      <input type="range" id="speed" min="1" max="120" step="1" value="4" />
    </div>
  </details>
</div>

<div id="stats">balls <b id="ballCount">0</b> · pairs <b id="pairCount">0</b> · <b id="fps">0</b> fps · <b id="mode">…</b></div>
<div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------------
const appEl = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
// Filmic tone mapping: rolls bright highlights off smoothly instead of clipping
// them to a flat white blob, so lit faces keep a visible rounded gradient.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
// Soft shadows. Kept enabled at the renderer level; the "Shadows" toggle flips
// the key light's castShadow so turning it off skips the extra depth pass.
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
appEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = 0x6a6f78;                 // grey backdrop so white balls read as white
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.006);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 200;

// Lighting. One dominant key light gives the bright (near-white) lit side; a
// dim fill and rim keep shadows from going pure black without flattening them;
// ambient/hemisphere are deliberately low so shadowed faces stay dark. The
// contrast (roundness) comes from the strong directional gradient, and ACES
// tone mapping keeps the brightest faces from clipping to a flat white patch.
// (Turned down a touch now that the backdrop is grey rather than black.)
scene.add(new THREE.HemisphereLight(0xcdd8f2, 0x05070c, 0.38));
scene.add(new THREE.AmbientLight(0xffffff, 0.1));
const keyDirs = [
  { color: 0xffffff, intensity: 3.0, pos: [ 10,  16,  10] }, // dominant key
  { color: 0xbcd0ff, intensity: 0.75, pos: [-13,  -1,  -4] }, // dim cool fill
  { color: 0x88aaff, intensity: 1.15, pos: [ -6,   8, -14] }, // back rim (edge separation)
];
let keyLight = null;
keyDirs.forEach((d, idx) => {
  const light = new THREE.DirectionalLight(d.color, d.intensity);
  light.position.set(...d.pos);
  scene.add(light);
  if (idx === 0) keyLight = light;          // only the dominant key casts shadows
});

// Shadow setup on the key light. Orthographic frustum sized to comfortably
// contain the relaxed knot; normalBias counters self-shadow acne on the
// low-poly spheres' faceted normals. castShadow is the on/off switch.
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 70;
keyLight.shadow.camera.left = -28;
keyLight.shadow.camera.right = 28;
keyLight.shadow.camera.top = 28;
keyLight.shadow.camera.bottom = -28;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.06;

// Fixed floor height: the grid, the shadow catcher, and the physics floor all
// live here, so the knot rests on the visible grid.
const GROUND_Y = -22;

// Subtle ground grid for spatial orientation
const grid = new THREE.GridHelper(80, 40, 0x2a3450, 0x1a2236);
grid.position.y = GROUND_Y;
scene.add(grid);

// Shadow catcher: a transparent plane that shows ONLY the received shadow, so it
// grounds the knot without adding a visible floor. When the key light isn't
// casting (shadows off), ShadowMaterial draws nothing.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);

// Spawn-sphere reference wireframe (toggleable)
const spawnSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0x6ea8fe, wireframe: true, transparent: true, opacity: 0.08 })
);
spawnSphere.visible = false;
scene.add(spawnSphere);

// ---------------------------------------------------------------------------
// Simulation state
// ---------------------------------------------------------------------------
const cfg = {
  n: 24,
  radius: 1.0,          // rendering radius: ball size (cosmetic only)
  interact: 1.0,        // interaction radius: collision happens within 2·interact; drives LOD spacing
  sphere: 15,
  ignoreK: 7,
  mergeRatio: 0.3,      // LOD: drop a ball when a chain edge is shorter than this × interact radius
  splitRatio: 0.6,      // LOD: insert a ball when a chain edge is longer than this × interact radius
  spring: 0.6,
  collide: 1.0,
  damp: 0.9,
  jiggle: 0,
  gravity: 0.015,       // downward weight per ball; balls rest on the fixed grid floor
  substeps: 4,
  autoSubsteps: true,   // adapt substeps each ~0.5s to hold ~30 fps
  paused: false,
  showLinks: false,
  showSpawn: false,
  shadows: true,
};

// Instanced rendering ---------------------------------------------------------
const MAX_BALLS = 12000;

let seedPoints = [];   // the N random points defining the loop skeleton
// Ball centers/velocities live in fixed-capacity flat arrays; `ballCount` is the
// logical length. The adaptive LOD pass adds/removes balls in place, so we never
// reallocate during the simulation — `posScratch`/`velScratch` hold the rebuilt
// sequence for one LOD pass before it is copied back.
let pos = new Float32Array(MAX_BALLS * 3);
let vel = new Float32Array(MAX_BALLS * 3);
const posScratch = new Float32Array(MAX_BALLS * 3);
const velScratch = new Float32Array(MAX_BALLS * 3);
let ballCount = 0;
let lastPairCount = 0;
let gpu = null;        // WebGPU physics engine, or null (CPU fallback)
const ballGeo = new THREE.SphereGeometry(1, 18, 14);
// NOTE: do NOT set vertexColors here. For an InstancedMesh the per-instance
// color comes from `instanceColor` (the USE_INSTANCING_COLOR shader path).
// Enabling vertexColors would make the shader also multiply by a per-vertex
// `color` attribute that this geometry lacks — which reads as (0,0,0) and turns
// the albedo black (the "graphite" bug).
const ballMat = new THREE.MeshStandardMaterial({
  roughness: 0.5, metalness: 0.0,
});
let instMesh = new THREE.InstancedMesh(ballGeo, ballMat, MAX_BALLS);
instMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
instMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_BALLS * 3), 3);
instMesh.count = 0;
instMesh.castShadow = true;       // balls cast onto each other and the ground
instMesh.receiveShadow = true;    // ...and receive, so the tangle self-shadows
scene.add(instMesh);

const tmpColor = new THREE.Color();

// Chain link line (toggleable) -----------------------------------------------
let linkLine = null;

// ---------------------------------------------------------------------------
// Geometry generation
// ---------------------------------------------------------------------------

// Uniform random point inside a sphere of the given radius.
function randomInSphere(R) {
  // r ∝ u^(1/3) gives uniform volume density; direction uniform on unit sphere.
  const u = Math.random();
  const r = R * Math.cbrt(u);
  const cosT = 2 * Math.random() - 1;
  const sinT = Math.sqrt(1 - cosT * cosT);
  const phi = 2 * Math.PI * Math.random();
  return new THREE.Vector3(
    r * sinT * Math.cos(phi),
    r * sinT * Math.sin(phi),
    r * cosT
  );
}

// Pick N fresh random seed points in the spawn sphere.
function regenerateSeed() {
  seedPoints = [];
  for (let i = 0; i < cfg.n; i++) seedPoints.push(randomInSphere(cfg.sphere));
  buildChain();
}

// Resample the closed polyline (the cycle through seedPoints) placing ball
// centers spaced `radius` apart by arc length, then (re)build the buffers.
function buildChain() {
  const spacing = cfg.interact;          // centers spaced one interaction radius apart
  const pts = seedPoints;
  const N = pts.length;
  if (N < 3) return;

  // Total perimeter of the closed loop.
  let total = 0;
  for (let i = 0; i < N; i++) total += pts[i].distanceTo(pts[(i + 1) % N]);

  // How many balls fit. Guard against absurd counts.
  let count = Math.max(3, Math.floor(total / spacing));
  count = Math.min(count, MAX_BALLS);

  const step = total / count;            // even spacing so the loop closes cleanly
  const centers = [];
  for (let k = 0; k < count; k++) {
    centers.push(pointAtArcLength(pts, k * step)); // arc-length position of center k
  }

  ballCount = centers.length;
  for (let i = 0; i < ballCount; i++) {
    pos[i * 3 + 0] = centers[i].x;
    pos[i * 3 + 1] = centers[i].y;
    pos[i * 3 + 2] = centers[i].z;
    vel[i * 3 + 0] = vel[i * 3 + 1] = vel[i * 3 + 2] = 0;
  }
  recenter();
  rebuildLinkLine();
  if (gpu) gpu.upload(ballCount);     // push the fresh chain to the GPU
  document.getElementById('ballCount').textContent = ballCount;
}

// Point at a given arc length along the closed polyline.
function pointAtArcLength(pts, target) {
  const N = pts.length;
  let acc = 0;
  for (let i = 0; i < N; i++) {
    const a = pts[i], b = pts[(i + 1) % N];
    const segLen = a.distanceTo(b);
    if (acc + segLen >= target || i === N - 1) {
      const t = segLen > 1e-9 ? (target - acc) / segLen : 0;
      return new THREE.Vector3().lerpVectors(a, b, Math.min(Math.max(t, 0), 1));
    }
    acc += segLen;
  }
  return pts[0].clone();
}

// ---------------------------------------------------------------------------
// Physics
// ---------------------------------------------------------------------------

// Spatial hash grid for broad-phase collision among balls 3+ apart on the chain.
const hashGrid = new Map();
function gridKey(ix, iy, iz) { return ix + ',' + iy + ',' + iz; }

function step(dt) {
  const k_spring = cfg.spring;
  const k_col = cfg.collide;
  const r = cfg.interact;                // collisions use the interaction radius
  const minDist = 2 * r;                 // balls just touch at 2·interact
  const cell = minDist;                  // grid cell = interaction range
  const n = ballCount;

  // Accumulate forces.
  const force = new Float32Array(n * 3);

  // --- Springs: chain-adjacent balls (closed loop), target length 0 -> pull together.
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = pos[j * 3] - pos[i * 3];
    const dy = pos[j * 3 + 1] - pos[i * 3 + 1];
    const dz = pos[j * 3 + 2] - pos[i * 3 + 2];
    // Target distance 0 => force is proportional to the full separation vector.
    const fx = k_spring * dx, fy = k_spring * dy, fz = k_spring * dz;
    force[i * 3] += fx;     force[i * 3 + 1] += fy;     force[i * 3 + 2] += fz;
    force[j * 3] -= fx;     force[j * 3 + 1] -= fy;     force[j * 3 + 2] -= fz;
  }

  // --- Collisions: rebuild grid, test near pairs, skip 1st/2nd chain neighbors.
  hashGrid.clear();
  for (let i = 0; i < n; i++) {
    const ix = Math.floor(pos[i * 3] / cell);
    const iy = Math.floor(pos[i * 3 + 1] / cell);
    const iz = Math.floor(pos[i * 3 + 2] / cell);
    const key = gridKey(ix, iy, iz);
    let bucket = hashGrid.get(key);
    if (!bucket) { bucket = []; hashGrid.set(key, bucket); }
    bucket.push(i);
  }

  let pairs = 0;
  for (let i = 0; i < n; i++) {
    const cx = Math.floor(pos[i * 3] / cell);
    const cy = Math.floor(pos[i * 3 + 1] / cell);
    const cz = Math.floor(pos[i * 3 + 2] / cell);
    for (let gx = -1; gx <= 1; gx++)
    for (let gy = -1; gy <= 1; gy++)
    for (let gz = -1; gz <= 1; gz++) {
      const bucket = hashGrid.get(gridKey(cx + gx, cy + gy, cz + gz));
      if (!bucket) continue;
      for (let b = 0; b < bucket.length; b++) {
        const j = bucket[b];
        if (j <= i) continue;            // each unordered pair once
        // Ignore the K nearest neighbors (either direction) along the cyclic chain.
        const d = j - i;
        const cyc = Math.min(d, n - d);
        if (cyc <= cfg.ignoreK) continue;

        const dx = pos[j * 3] - pos[i * 3];
        const dy = pos[j * 3 + 1] - pos[i * 3 + 1];
        const dz = pos[j * 3 + 2] - pos[i * 3 + 2];
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 >= minDist * minDist || d2 < 1e-12) continue;

        pairs++;
        const dist = Math.sqrt(d2);
        const overlap = minDist - dist;
        const inv = 1 / dist;
        const fx = -k_col * overlap * dx * inv;
        const fy = -k_col * overlap * dy * inv;
        const fz = -k_col * overlap * dz * inv;
        force[i * 3] += fx;   force[i * 3 + 1] += fy;   force[i * 3 + 2] += fz;
        force[j * 3] -= fx;   force[j * 3 + 1] -= fy;   force[j * 3 + 2] -= fz;
      }
    }
  }
  lastPairCount = pairs;

  // --- Jiggle: random thermal kick added to every ball (0 = off).
  if (cfg.jiggle > 0) {
    const j = cfg.jiggle;
    for (let i = 0; i < n * 3; i++) force[i] += (Math.random() * 2 - 1) * j;
  }

  // --- Gravity: a constant downward weight on every ball (0 = off).
  if (cfg.gravity > 0) {
    for (let i = 0; i < n; i++) force[i * 3 + 1] -= cfg.gravity;
  }

  // --- Integrate (damped semi-implicit Euler).
  const damp = cfg.damp;
  for (let i = 0; i < n * 3; i++) {
    vel[i] = (vel[i] + force[i] * dt) * damp;
    pos[i] += vel[i] * dt;
  }

  // --- Floor: a ball's bottom (center − render radius) can't sink below the
  // fixed grid. Clamp and kill any downward velocity so it rests on the grid.
  const floorY = GROUND_Y + cfg.radius;
  for (let i = 0; i < n; i++) {
    if (pos[i * 3 + 1] < floorY) {
      pos[i * 3 + 1] = floorY;
      if (vel[i * 3 + 1] < 0) vel[i * 3 + 1] = 0;
    }
  }

  recenter();
}

// Keep the centroid horizontally centered at x=z=0. The vertical position is
// left free so gravity can pull the knot down onto the floor.
function recenter() {
  const n = ballCount;
  if (!n) return;
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += pos[i * 3]; cz += pos[i * 3 + 2]; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) { pos[i * 3] -= cx; pos[i * 3 + 2] -= cz; }
}

// Adaptive level-of-detail along the cycle: keep the spacing of ball centers
// between `mergeRatio` and `splitRatio` times the render radius. Walking the
// closed loop, an edge shorter than mergeRatio·r drops a ball (merge), an edge
// longer than splitRatio·r gets a ball inserted at its midpoint (split).
// Rebuilds the sequence into the scratch buffers, then copies it back.
function applyLOD() {
  const n = ballCount;
  if (n < 4) return;
  const rr = cfg.interact;                // LOD spacing is keyed to interaction radius
  const minD2 = (cfg.mergeRatio * rr) ** 2;
  const maxD = cfg.splitRatio * rr;
  const maxD2 = maxD * maxD;
  // Floor the ball count so plenty of non-neighbor pairs always remain
  // (cyc > ignoreK), keeping collisions alive. Without this, over-merging
  // disables all collisions and the springs implode the loop to a single point.
  // 6·(K+1) keeps the relaxed loop reasonably sized even for a trivial knot.
  const MIN_BALLS = 6 * (cfg.ignoreK + 1);

  let m = 0;                              // number of balls written to scratch
  const push = (x, y, z, vx, vy, vz) => {
    if (m >= MAX_BALLS) return;
    const o = m * 3;
    posScratch[o] = x; posScratch[o + 1] = y; posScratch[o + 2] = z;
    velScratch[o] = vx; velScratch[o + 1] = vy; velScratch[o + 2] = vz;
    m++;
  };

  // Keep ball 0 as the anchor, then walk the rest, merging/splitting vs. the
  // most recently kept ball.
  push(pos[0], pos[1], pos[2], vel[0], vel[1], vel[2]);

  for (let i = 1; i < n; i++) {
    const lo = (m - 1) * 3;               // last kept ball
    const lx = posScratch[lo], ly = posScratch[lo + 1], lz = posScratch[lo + 2];
    const io = i * 3;
    const ix = pos[io], iy = pos[io + 1], iz = pos[io + 2];
    const dx = ix - lx, dy = iy - ly, dz = iz - lz;
    const dd = dx * dx + dy * dy + dz * dz;

    if (dd < minD2 && m > MIN_BALLS) continue;          // merge: drop ball i

    if (dd > maxD2) {                                   // split: midpoint first
      push((lx + ix) * 0.5, (ly + iy) * 0.5, (lz + iz) * 0.5,
           (velScratch[lo] + vel[io]) * 0.5,
           (velScratch[lo + 1] + vel[io + 1]) * 0.5,
           (velScratch[lo + 2] + vel[io + 2]) * 0.5);
    }
    push(ix, iy, iz, vel[io], vel[io + 1], vel[io + 2]);
  }

  // Closing edge: last kept ball back to ball 0 (the loop is cyclic).
  if (m > 1) {
    const lo = (m - 1) * 3;
    const dx = posScratch[0] - posScratch[lo];
    const dy = posScratch[1] - posScratch[lo + 1];
    const dz = posScratch[2] - posScratch[lo + 2];
    const dd = dx * dx + dy * dy + dz * dz;
    if (dd < minD2 && m > MIN_BALLS) {
      m--;                                              // merge: drop last kept
    } else if (dd > maxD2) {                            // split: insert midpoint
      push((posScratch[lo] + posScratch[0]) * 0.5,
           (posScratch[lo + 1] + posScratch[1]) * 0.5,
           (posScratch[lo + 2] + posScratch[2]) * 0.5,
           (velScratch[lo] + velScratch[0]) * 0.5,
           (velScratch[lo + 1] + velScratch[1]) * 0.5,
           (velScratch[lo + 2] + velScratch[2]) * 0.5);
    }
  }

  pos.set(posScratch.subarray(0, m * 3));
  vel.set(velScratch.subarray(0, m * 3));
  if (m !== ballCount) document.getElementById('ballCount').textContent = m;
  ballCount = m;
}

// ---------------------------------------------------------------------------
// Rendering sync
// ---------------------------------------------------------------------------
let colorN = -1;   // ball count the instance colors were last written for

function syncInstances() {
  const n = ballCount;
  instMesh.count = n;
  const r = cfg.radius;
  // Write the instance matrices directly (translation + uniform scale) — much
  // cheaper per frame than going through an Object3D for tens of thousands of balls.
  const m = instMesh.instanceMatrix.array;
  for (let i = 0; i < n; i++) {
    const o = i * 16, b = i * 3;
    m[o] = r;     m[o+1] = 0;  m[o+2] = 0;   m[o+3] = 0;
    m[o+4] = 0;   m[o+5] = r;  m[o+6] = 0;   m[o+7] = 0;
    m[o+8] = 0;   m[o+9] = 0;  m[o+10] = r;  m[o+11] = 0;
    m[o+12] = pos[b]; m[o+13] = pos[b+1]; m[o+14] = pos[b+2]; m[o+15] = 1;
  }
  instMesh.instanceMatrix.needsUpdate = true;

  // Hue makes one full turn around the cycle. It only depends on i/n, so we only
  // rewrite it when the ball count changes (every frame would be wasted work).
  if (n !== colorN) {
    for (let i = 0; i < n; i++) instMesh.setColorAt(i, tmpColor.setHSL(i / n, 0.78, 0.55));
    if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
    colorN = n;
  }
}

function rebuildLinkLine() {
  if (linkLine) { scene.remove(linkLine); linkLine.geometry.dispose(); linkLine.material.dispose(); linkLine = null; }
  if (!cfg.showLinks) return;
  const geo = new THREE.BufferGeometry();
  // Full-capacity buffer: the ball count changes every frame via the LOD pass.
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_BALLS * 3), 3));
  linkLine = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 }));
  scene.add(linkLine);
}

function syncLinkLine() {
  if (!linkLine) return;
  const arr = linkLine.geometry.attributes.position.array;
  for (let i = 0; i < ballCount; i++) {
    arr[i * 3] = pos[i * 3]; arr[i * 3 + 1] = pos[i * 3 + 1]; arr[i * 3 + 2] = pos[i * 3 + 2];
  }
  linkLine.geometry.setDrawRange(0, ballCount);
  linkLine.geometry.attributes.position.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// WebGPU physics engine (optional; falls back to the CPU step() above).
//
// Compute-only design: the GPU owns the authoritative positions/velocities and
// runs the full per-substep physics (spring + collision via a uniform grid +
// gravity + integrate + floor). Each frame the CPU reads positions back to drive
// the existing instanced rendering, and every LOD_INTERVAL frames it also reads
// velocities back to run recenter() + applyLOD() on the CPU and re-upload — so
// the adaptive level-of-detail happens "from time to time" rather than per frame.
//
// Anything missing/failing about WebGPU leaves gpu === null and the app runs the
// CPU path unchanged.
// ---------------------------------------------------------------------------
const GRID_CAP = 64;            // uniform-grid resolution cap per axis (64^3 cells)
const CELL_CAP = 64;            // max balls tracked per cell (overflow checks dropped)
const WORLD_MIN = -35, WORLD_SIZE = 70;   // simulation box [-35, 35] per axis
const LOD_INTERVAL = 20;        // frames between CPU LOD/recenter syncs

const PHYS_WGSL = /* wgsl */`
struct Params {
  n: u32, gridDim: u32, ignoreK: u32, frameSeed: u32,
  dt: f32, kSpring: f32, kCol: f32, interact: f32,
  minDist: f32, gravity: f32, jiggle: f32, damp: f32,
  floorY: f32, cellSize: f32, worldMin: f32, cellCap: u32,
};
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> pos: array<f32>;
@group(0) @binding(2) var<storage, read_write> vel: array<f32>;
@group(0) @binding(3) var<storage, read_write> force: array<f32>;
@group(0) @binding(4) var<storage, read_write> cellCount: array<atomic<u32>>;
@group(0) @binding(5) var<storage, read_write> cellItems: array<u32>;

fn pv(i: u32) -> vec3<f32> { return vec3<f32>(pos[3u*i], pos[3u*i+1u], pos[3u*i+2u]); }
fn axis(v: f32) -> i32 {
  return clamp(i32(floor((v - P.worldMin) / P.cellSize)), 0, i32(P.gridDim) - 1);
}
fn cellOf(p: vec3<f32>) -> u32 {
  return (u32(axis(p.z))*P.gridDim + u32(axis(p.y)))*P.gridDim + u32(axis(p.x));
}
fn hash1(s: u32) -> f32 {           // cheap PCG-ish hash -> [0,1)
  var x = s * 747796405u + 2891336453u;
  x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u;
  x = (x >> 22u) ^ x;
  return f32(x) / 4294967296.0;
}

@compute @workgroup_size(64) fn clearGrid(@builtin(global_invocation_id) g: vec3<u32>) {
  let i = g.x;
  if (i >= arrayLength(&cellCount)) { return; }
  atomicStore(&cellCount[i], 0u);
}

@compute @workgroup_size(64) fn buildGrid(@builtin(global_invocation_id) g: vec3<u32>) {
  let i = g.x;
  if (i >= P.n) { return; }
  let c = cellOf(pv(i));
  let slot = atomicAdd(&cellCount[c], 1u);
  if (slot < P.cellCap) { cellItems[c * P.cellCap + slot] = i; }
}

@compute @workgroup_size(64) fn computeForces(@builtin(global_invocation_id) g: vec3<u32>) {
  let i = g.x;
  let n = P.n;
  if (i >= n) { return; }
  let pi = pv(i);
  var f = vec3<f32>(0.0);
  // Springs to the two cyclic chain neighbors, target length 0.
  let prev = (i + n - 1u) % n;
  let nxt  = (i + 1u) % n;
  f += P.kSpring * ((pv(prev) - pi) + (pv(nxt) - pi));
  // Collisions: scan the 3x3x3 neighbor cells; skip the K nearest chain neighbors.
  let cx = axis(pi.x); let cy = axis(pi.y); let cz = axis(pi.z);
  let gd = i32(P.gridDim);
  let md2 = P.minDist * P.minDist;
  for (var oz = -1; oz <= 1; oz++) {
    let zz = clamp(cz + oz, 0, gd - 1);
    for (var oy = -1; oy <= 1; oy++) {
      let yy = clamp(cy + oy, 0, gd - 1);
      for (var ox = -1; ox <= 1; ox++) {
        let xx = clamp(cx + ox, 0, gd - 1);
        let cid = (u32(zz)*P.gridDim + u32(yy))*P.gridDim + u32(xx);
        let cnt = min(atomicLoad(&cellCount[cid]), P.cellCap);
        for (var s = 0u; s < cnt; s = s + 1u) {
          let j = cellItems[cid * P.cellCap + s];
          if (j == i) { continue; }
          let di = select(j - i, i - j, i > j);   // |i - j|
          let cyc = min(di, n - di);
          if (cyc <= P.ignoreK) { continue; }
          let diff = pv(j) - pi;                   // from i to j
          let d2 = dot(diff, diff);
          if (d2 >= md2 || d2 < 1e-12) { continue; }
          let dist = sqrt(d2);
          f += (P.kCol * (P.minDist - dist) / dist) * (-diff);   // push i away from j
        }
      }
    }
  }
  f.y -= P.gravity;
  if (P.jiggle > 0.0) {
    let r = vec3<f32>(hash1(3u*i + P.frameSeed),
                      hash1(3u*i + 1u + P.frameSeed*7u),
                      hash1(3u*i + 2u + P.frameSeed*13u)) * 2.0 - 1.0;
    f += r * P.jiggle;
  }
  force[3u*i] = f.x; force[3u*i+1u] = f.y; force[3u*i+2u] = f.z;
}

@compute @workgroup_size(64) fn integrate(@builtin(global_invocation_id) g: vec3<u32>) {
  let i = g.x;
  if (i >= P.n) { return; }
  let b = 3u*i;
  var v = vec3<f32>(vel[b], vel[b+1u], vel[b+2u]);
  let fo = vec3<f32>(force[b], force[b+1u], force[b+2u]);
  var p = vec3<f32>(pos[b], pos[b+1u], pos[b+2u]);
  v = (v + fo * P.dt) * P.damp;
  p += v * P.dt;
  if (p.y < P.floorY) { p.y = P.floorY; if (v.y < 0.0) { v.y = 0.0; } }
  pos[b]=p.x; pos[b+1u]=p.y; pos[b+2u]=p.z;
  vel[b]=v.x; vel[b+1u]=v.y; vel[b+2u]=v.z;
}`;

async function createGPUEngine() {
  if (!('gpu' in navigator)) return null;
  let device;
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) return null;
    device = await adapter.requestDevice();
  } catch (e) { console.warn('WebGPU unavailable, using CPU physics:', e); return null; }
  device.addEventListener && device.addEventListener('uncapturederror',
    ev => console.error('WebGPU error:', ev.error && ev.error.message));

  const numCells = GRID_CAP * GRID_CAP * GRID_CAP;
  const bytes = MAX_BALLS * 3 * 4;
  const U = GPUBufferUsage;
  const mk = (size, usage) => device.createBuffer({ size, usage });
  const paramsBuf   = mk(64, U.UNIFORM | U.COPY_DST);
  const posBuf      = mk(bytes, U.STORAGE | U.COPY_SRC | U.COPY_DST);
  const velBuf      = mk(bytes, U.STORAGE | U.COPY_SRC | U.COPY_DST);
  const forceBuf    = mk(bytes, U.STORAGE);
  const cellCountBuf= mk(numCells * 4, U.STORAGE);
  const cellItemsBuf= mk(numCells * CELL_CAP * 4, U.STORAGE);
  const posStaging  = mk(bytes, U.MAP_READ | U.COPY_DST);
  const velStaging  = mk(bytes, U.MAP_READ | U.COPY_DST);

  const module = device.createShaderModule({ code: PHYS_WGSL });
  const bgl = device.createBindGroupLayout({ entries: [0,1,2,3,4,5].map(binding => ({
    binding, visibility: GPUShaderStage.COMPUTE,
    buffer: { type: binding === 0 ? 'uniform' : 'storage' },
  })) });
  const pl = device.createPipelineLayout({ bindGroupLayouts: [bgl] });
  const pipe = (entryPoint) => device.createComputePipeline({ layout: pl, compute: { module, entryPoint } });
  const pipes = { clear: pipe('clearGrid'), build: pipe('buildGrid'), forces: pipe('computeForces'), integrate: pipe('integrate') };
  const bind = device.createBindGroup({ layout: bgl, entries: [paramsBuf, posBuf, velBuf, forceBuf, cellCountBuf, cellItemsBuf]
    .map((buffer, binding) => ({ binding, resource: { buffer } })) });

  const pbuf = new ArrayBuffer(64);
  const pu = new Uint32Array(pbuf), pf = new Float32Array(pbuf);
  let frame = 0;
  const wg = (x) => Math.max(1, Math.ceil(x / 64));

  function writeParams(n, seed) {
    let cellSize = 2 * cfg.interact;                 // ±1 cell covers the interaction range
    let gridDim = Math.ceil(WORLD_SIZE / cellSize);
    if (gridDim > GRID_CAP) { gridDim = GRID_CAP; cellSize = WORLD_SIZE / gridDim; }
    pu[0] = n; pu[1] = gridDim; pu[2] = cfg.ignoreK; pu[3] = seed >>> 0;
    pf[4] = 0.18; pf[5] = cfg.spring; pf[6] = cfg.collide; pf[7] = cfg.interact;
    pf[8] = 2 * cfg.interact; pf[9] = cfg.gravity; pf[10] = cfg.jiggle; pf[11] = cfg.damp;
    pf[12] = GROUND_Y + cfg.radius; pf[13] = cellSize; pf[14] = WORLD_MIN; pu[15] = CELL_CAP;
    device.queue.writeBuffer(paramsBuf, 0, pbuf);
  }

  function stepGPU(n, substeps) {
    for (let s = 0; s < substeps; s++) {
      writeParams(n, frame * 31 + s);
      const enc = device.createCommandEncoder();
      // Separate passes per stage so writes are ordered (clear -> build -> forces -> integrate).
      const dispatch = (pipeline, count) => {
        const p = enc.beginComputePass();
        p.setPipeline(pipeline); p.setBindGroup(0, bind);
        p.dispatchWorkgroups(wg(count)); p.end();
      };
      dispatch(pipes.clear, numCells);
      dispatch(pipes.build, n);
      dispatch(pipes.forces, n);
      dispatch(pipes.integrate, n);
      device.queue.submit([enc.finish()]);
    }
    frame++;
  }

  async function readInto(srcBuf, staging, n, dest) {
    const len = n * 3 * 4;
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(srcBuf, 0, staging, 0, len);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ, 0, len);
    dest.set(new Float32Array(staging.getMappedRange(0, len)));
    staging.unmap();
  }

  return {
    device,
    step: stepGPU,
    readPositions: (n) => readInto(posBuf, posStaging, n, pos),
    readVelocities: (n) => readInto(velBuf, velStaging, n, vel),
    upload: (n) => {
      device.queue.writeBuffer(posBuf, 0, pos, 0, n * 3);
      device.queue.writeBuffer(velBuf, 0, vel, 0, n * 3);
    },
  };
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let lastT = performance.now();
let fpsAccum = 0, fpsFrames = 0;
const fpsEl = document.getElementById('fps');
const pairEl = document.getElementById('pairCount');

// Pan the camera vertically so it always looks at the knot's centroid height.
// The knot is centered at x=z=0 (recenter), so only the y of the orbit target
// needs to track. Moving the camera and the target by the same delta keeps the
// user's orbit angle and zoom intact — it just follows the knot up and down.
function followCentroidY() {
  if (!ballCount) return;
  let cy = 0;
  for (let i = 0; i < ballCount; i++) cy += pos[i * 3 + 1];
  cy /= ballCount;
  const dy = (cy - controls.target.y) * 0.12;   // smooth follow
  controls.target.y += dy;
  camera.position.y += dy;
}

let lodTick = 0;

async function animate() {
  const now = performance.now();
  const frameDt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  if (!cfg.paused && ballCount) {
    if (gpu) {
      try {
        gpu.step(ballCount, cfg.substeps);
        await gpu.readPositions(ballCount);   // refresh CPU mirror for rendering
        if (++lodTick >= LOD_INTERVAL) {       // periodic CPU sync: recenter + LOD
          lodTick = 0;
          await gpu.readVelocities(ballCount);
          recenter();
          applyLOD();
          gpu.upload(ballCount);
        }
      } catch (e) {
        console.error('GPU physics failed, falling back to CPU:', e);
        gpu = null;                            // disable GPU for the rest of the session
        document.getElementById('mode').textContent = 'CPU (gpu error)';
      }
    } else {
      const dt = 0.18;                         // fixed sim dt for stability
      for (let s = 0; s < cfg.substeps; s++) step(dt);
      applyLOD();
      recenter();
    }
  }

  syncInstances();
  syncLinkLine();
  pairEl.textContent = gpu ? '—' : lastPairCount;

  followCentroidY();
  controls.update();
  renderer.render(scene, camera);

  // FPS readout (updated ~2×/s) + auto substeps controller.
  fpsAccum += frameDt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    const fps = fpsFrames / fpsAccum;
    fpsEl.textContent = Math.round(fps);
    fpsAccum = 0; fpsFrames = 0;
    if (cfg.autoSubsteps && !cfg.paused) autoTuneSubsteps(fps);
  }

  requestAnimationFrame(animate);
}

// Drive the substeps/frame toward whatever holds ~30 fps. Proportional step with
// a deadband (no thrash near target) and a rate limit (no wild swings).
const FPS_TARGET = 30;
const MAX_SUBSTEPS = 120;
function autoTuneSubsteps(fps) {
  if (fps <= 0 || Math.abs(fps - FPS_TARGET) <= 3) return;
  let next = Math.round(cfg.substeps * fps / FPS_TARGET);     // fps ~ inversely ∝ substeps
  next = Math.max(cfg.substeps - 8, Math.min(cfg.substeps + 8, next));   // rate limit
  next = Math.max(1, Math.min(MAX_SUBSTEPS, next));
  if (next !== cfg.substeps) { cfg.substeps = next; setSubstepsDisplay(next); }
}
function setSubstepsDisplay(v) {
  const el = document.getElementById('speed');
  if (el) el.value = v;
  const valEl = document.getElementById('speedVal');
  if (valEl) valEl.textContent = v;
}

// ---------------------------------------------------------------------------
// UI wiring
// ---------------------------------------------------------------------------
function bindSlider(id, key, fmt, onChange) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'Val');
  const update = () => {
    cfg[key] = parseFloat(el.value);
    if (valEl) valEl.textContent = fmt ? fmt(cfg[key]) : el.value;
    if (onChange) onChange();
  };
  el.addEventListener('input', update);
  update();
}

bindSlider('n', 'n', v => v | 0, regenerateSeed);
bindSlider('radius', 'radius', v => v.toFixed(2)); // render radius: purely cosmetic (ball size only)
bindSlider('interact', 'interact', v => v.toFixed(2));
bindSlider('sphere', 'sphere', v => (v % 1 ? v.toFixed(1) : v), () => { updateSpawnSphere(); });
bindSlider('ignoreK', 'ignoreK', v => v | 0);
bindSlider('mergeRatio', 'mergeRatio', v => v.toFixed(2));
bindSlider('splitRatio', 'splitRatio', v => v.toFixed(2));
bindSlider('spring', 'spring', v => v.toFixed(2));
bindSlider('collide', 'collide', v => v.toFixed(2));
bindSlider('damp', 'damp', v => v.toFixed(2));
bindSlider('jiggle', 'jiggle', v => v.toFixed(2));
bindSlider('gravity', 'gravity', v => v.toFixed(3));
bindSlider('speed', 'substeps', v => v | 0);

document.getElementById('regen').addEventListener('click', regenerateSeed);

const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => {
  cfg.paused = !cfg.paused;
  pauseBtn.textContent = cfg.paused ? 'Resume' : 'Pause';
});

document.getElementById('shadows').addEventListener('change', e => {
  cfg.shadows = e.target.checked;
  keyLight.castShadow = cfg.shadows;        // off = skip the shadow depth pass
});
document.getElementById('showLinks').addEventListener('change', e => {
  cfg.showLinks = e.target.checked;
  rebuildLinkLine();
});
document.getElementById('showSpawn').addEventListener('change', e => {
  cfg.showSpawn = e.target.checked;
  updateSpawnSphere();
});

// Auto-substeps: when on, the controller drives the slider, so disable manual input.
const speedEl = document.getElementById('speed');
function applyAutoSubstepsUI() {
  speedEl.disabled = cfg.autoSubsteps;
  speedEl.style.opacity = cfg.autoSubsteps ? 0.5 : 1;
}
document.getElementById('autoSubsteps').addEventListener('change', e => {
  cfg.autoSubsteps = e.target.checked;
  applyAutoSubstepsUI();
});
applyAutoSubstepsUI();

function updateSpawnSphere() {
  spawnSphere.scale.setScalar(cfg.sphere);
  spawnSphere.visible = cfg.showSpawn;
}

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Boot
(async () => {
  updateSpawnSphere();
  gpu = await createGPUEngine();        // null if WebGPU is unavailable / fails
  document.getElementById('mode').textContent = gpu ? 'GPU' : 'CPU';
  regenerateSeed();                     // fills CPU pos/vel; uploads to GPU if present
  lastT = performance.now();
  requestAnimationFrame(animate);
})();

// Debug handle for automated testing (harmless in production).
window.__dbg = {
  instMesh, camera, controls, grid, ground,
  get pos() { return pos; },
  get n() { return ballCount; },
  outputColorSpace: renderer.outputColorSpace,
  centroid() {
    let cx = 0, cy = 0, cz = 0;
    for (let i = 0; i < ballCount; i++) { cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; }
    return [cx / ballCount, cy / ballCount, cz / ballCount];
  },
  // RMS distance of centers from origin — a measure of overall spread.
  spread() {
    let s = 0;
    for (let i = 0; i < ballCount; i++) s += pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2;
    return Math.sqrt(s / ballCount);
  },
};
</script>
